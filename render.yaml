services:
  - type: web
    name: zhouwenwang-divination
    runtime: node
    repo: https://github.com/LittleDonkey1203/ai-bazi.git
    branch: deploy/render-monorepo
    plan: free
    buildCommand: npm --prefix zhouwenwang/zhouwenwang-divination ci --include=dev && npm --prefix zhouwenwang/zhouwenwang-divination/backend ci --include=dev && npm --prefix zhouwenwang/zhouwenwang-divination run build
    startCommand: npm --prefix zhouwenwang/zhouwenwang-divination/backend start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: API_BASE
        sync: false
      - key: API_KEY
        sync: false
      - key: MODEL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: bazi-mcp-http
    runtime: node
    repo: https://github.com/LittleDonkey1203/ai-bazi.git
    branch: deploy/render-monorepo
    plan: free
    buildCommand: npm --prefix bazi-mcp ci --include=dev && npm --prefix bazi-mcp run build
    startCommand: npm --prefix bazi-mcp run start:http
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
