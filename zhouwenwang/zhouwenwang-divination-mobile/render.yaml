services:
  - type: web
    name: zhouwenwang-divination
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix backend ci && npm run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: API_BASE
        sync: false
      - key: API_KEY
        sync: false
      - key: MODEL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
